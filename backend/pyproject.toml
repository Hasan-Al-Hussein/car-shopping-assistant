[project]
name = "car-shopping-assistant"
version = "0.1.0"
description = "Local simulated car-shopping assistant API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "google-genai==2.25.0",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.54",
    "tzdata==2026.4",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "mypy==2.3.1", "pytest==9.1.1", "ruff==0.16.8"]

[tool.uv]
package = false
python-downloads = "never"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
